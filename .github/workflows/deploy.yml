name: Deploy to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # daily refresh stars

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest
      - uses: actions/setup-node@1a4442cacd436585916779262731d5ab002ca6b
        with:
          node-version: 26
      - run: bun install --frozen-lockfile
      - run: bun run generate:projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bun run build
      - uses: actions/configure-pages@983d7736d9b0ae60b43ef2ff8a07a17d73c9c3bf
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@56afc609e7422eca1dfdea629fe52e9a44ba264b
        with:
          path: ./dist

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@49400a95be61a5c45551bc79e6181c06bfdec392
