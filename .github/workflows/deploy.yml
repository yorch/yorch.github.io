name: Deploy to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # daily refresh stars

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # pin: 11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4 # pin: 1a4442cacd436585916779262731d5ab002ca6b
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run generate:projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build
      - uses: actions/configure-pages@v5 # pin: 983d7736d9b0ae60b43ef2ff8a07a17d73c9c3bf
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3 # pin: 56afc609e7422eca1dfdea629fe52e9a44ba264b
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4 # pin: 49400a95be61a5c45551bc79e6181c06bfdec392
